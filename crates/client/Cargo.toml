[package]
name = "client"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"



[dependencies]
# A crate for mucking around with piles of bytes.
# License: Zlib OR Apache-2.0 OR MIT
bytemuck = { version = "1.18", features = ["derive"] }

# DirectDraw Surface file format parser/composer
# License: MIT 
ddsfile = "0.5"

# An easy-to-use immediate mode GUI that runs on both web and native
# License: MIT OR Apache-2.0
egui = "0.29"

# Bindings for using egui natively using the wgpu library
egui-wgpu = "0.29"

# Math library for video games
# License: MIT
gmm = { git = "https://github.com/HK416/gmm.git", features = ["bytemuck"] }

# A lightweight logging facade for Rust
# License: MIT OR Apache-2.0
log = "0.4"

# Rusty Object Notation
# License: MIT OR Apache-2.0
ron = "0.8"

# Cross-platform window creation library.
# License: Apache-2.0
winit = "0.30"

# Rusty WebGPU API wrapper
# License: MIT or Apache-2.0
wgpu = "22"



# 자체 프레임워크 라이브러리
mod-app = { path = "../mod-app" }
mod-asset = { path = "../mod-asset" }
mod-network = { path = "../mod-network" }
mod-parallelism = { path = "../mod-parallelism" }
mod-physics = { path = "../mod-physics" }
mod-world = { path = "../mod-world" }



[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# A logging implementation for `log` which is configured via an environment variable.
# License: MIT OR Apache-2.0
env_logger = "0.11"



[build-dependencies]
# Expanding std::fs and std::io. Recursively copy folders with information about process and much more.
# License: MIT
fs_extra = "1.3"

# A generic serialization/deserialization framework
# License: MIT OR Apache-2.0
serde = { version = "1.0", features = ["derive"] }

# A JSON serialization file format
# License: MIT OR Apache-2.0
serde_json = "1.0"
