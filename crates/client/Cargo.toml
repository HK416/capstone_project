[package]
name = "client"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true



[dependencies]
# 로그 인터페이스 라이브러리
# License: MIT or Apache-2.0
log = "0.4"

# 로그 출력 라이브러리 
# License: MIT or Apache-2.0
env_logger = "0.11"

# ron 포맷 인코딩, 디코딩 라이브러리
# License: MIT or Apache-2.0
ron = "0.8"

# 파일 임베딩 라이브러리
# License: MIT
rust-embed = "8.5"

# 데이터 직렬화 라이브러리
# License: MIT or Apache-2.0
serde = { version = "1.0", features = ["derive"] }

# byte 캐스팅 라이브러리
# License: Zlib or Apache-2.0 or MIT
bytemuck = { version = "1.16", features = ["derive"] }

# 이미지 로드 라이브러리
# License: MIT or Apache-2.0
image = "0.25"

# dds 포맷 이미지 디코딩 라이브러리
# License: MIT 
ddsfile = "0.5"

# 게임 수학 라이브러리
# License: MIT
gmm = { version = "0.2", features = ["bytemuck", "serde"] }

# Entity Component System (ECS) 라이브러리
# License: MIT or Apache-2.0
hecs = "0.10"

# 윈도우 생성 라이브러리
# License: Apache-2.0
winit = { version = "0.30", features = ["rwh_05"] }

# 크로스 플랫폼 렌더링 라이브러리 
# License: MIT or Apache-2.0
wgpu = "22"



# 자체 프레임워크 라이브러리
mod-app = { path = "../mod-app" }
mod-asset = { path = "../mod-asset" }
mod-network = { path = "../mod-network" }
mod-parallelism = { path = "../mod-parallelism" }
mod-physics = { path = "../mod-physics" }
mod-render = { path = "../mod-render" }
