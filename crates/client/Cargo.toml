[package]
name = "client"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"


[dependencies]
ahash = { workspace = true }
bitflags = { workspace = true }
bytemuck = { workspace = true }
chrono = { workspace = true }
constcat = { workspace = true }
dashmap = { workspace = true }
egui = { workspace = true }
glam = { workspace = true }
hecs = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

# DirectDraw Surface file format parser/composer
# License: MIT
ddsfile = "0.5"

# Imaging library. Provides basic image processing and encoders/decoders for common image formats.
# License: MIT OR Apache-2.0
image = { version = "0.25", features = ["dds", "png"], default-features = false }

# 자체 제작 프레임워크 
mod-app = { path = "../mod-app" }
mod-network = { path = "../mod-network" }
mod-parallelism = { path = "../mod-parallelism" }
mod-physics = { path = "../mod-physics" }
mod-render = { path = "../mod-render" }



[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Expanding std::fs and std::io. Recursively copy folders with information about process and much more.
# License: MIT
fs_extra = "1.3"



[features]
default = ["enable-shader-validation"]

# 쉐이더 생성시 유효성 검사를 활성화합니다.
enable-shader-validation = []

# 캐릭터의 변환 행렬을 출력할 때 사용합니다.
print-transform = []
