[package]
name = "server"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "stress_test"
path = "dummies/stress_test.rs"

[dependencies]
ahash = { workspace = true }
chrono = { workspace = true }
glam = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
num_cpus = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
static_assertions = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# An implementation of futures and streams featuring zero allocations, composability, and iterator-like interfaces.
# License: MIT OR Apache-2.0
futures = "0.3"

# An event-driven, non-blocking I/O platform for writing asynchronous I/O backed applications.
# License: MIT
tokio = { version = "1.45", features = ["full"] }

mod-parallelism = { path = "../mod-parallelism" }
mod-network = { path = "../mod-network" }
mod-physics = { path = "../mod-physics" }
mod-math = { path = "../mod-math" }

[build-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Expanding std::fs and std::io. Recursively copy folders with information about process and much more.
# License: MIT
fs_extra = "1.3"

[dependencies.console-subscriber]
version = "0.4"
optional = true

[features]
defualt = []
console = ["console-subscriber"]
