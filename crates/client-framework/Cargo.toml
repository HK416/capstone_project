[package]
name = "client-framework"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true



[dependencies]
# 로그 인터페이스 라이브러리
# License: MIT or Apache-2.0
log = "0.4"

# 에러 타입을 쉽게 만들어주는 라이브러리
# License: MIT or Apache-2.0
thiserror = "1.0"

# Entity Component System (ECS) 라이브러리
# License: MIT or Apache-2.0
hecs = "0.10"

# 데이터 직렬화 라이브러리
# License: MIT or Apache-2.0
serde = { version = "1.0", features = ["derive"] }

# Lazy initialization 라이브러리
# License: MIT or Apache-2.0
lazy_static = "1.5"

# bit 수준 Flag를 생성하는 라이브러리
# License: MIT or Apache-2.0
bitflags = "2.6"

# byte 캐스팅 라이브러리
# License: Zlib or Apache-2.0 or MIT
bytemuck = { version = "1.16", features = ["derive"] }

# 게임 수학 라이브러리
# License: MIT
gmm = { version = "0.2", features = ["bytemuck"] }

# 윈도우 생성 라이브러리
# License: Apache-2.0
winit = { version = "0.30", features = ["rwh_05"] }

# 크로스 플랫폼 렌더링 라이브러리 
# License: MIT or Apache-2.0
wgpu = "22"

# 자체 프레임워크 라이브러리
framework = { path = "../framework", version = "0.2" }



[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# 사용 플랫폼: Windows, macOS
# 시스템 대화 상자를 화면에 표시하는 라이브러리
# License: MIT or Apache-2.0
native-dialog = "0.7"

# 사용 플랫폼: Windows, macOS
# 동기화를 위한 스레드 blocking 라이브러리
# License: MIT or Apache-2.0
pollster = "0.3"



[features]
default = ["command-line-args", "enable-debug-info", "enable-shader-validation"]

# 명령줄 인수를 허용합니다.
command-line-args = []

# 에러 메시지에 디버깅 정보를 포함합니다.
enable-debug-info = []

# 쉐이더 코드가 유효한지 검사합니다.
enable-shader-validation = []
