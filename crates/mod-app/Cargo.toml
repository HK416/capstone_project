[package]
name = "mod-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
publish.workspace = true



[dependencies]
# Entity Component System (ECS) 라이브러리
# License: MIT or Apache-2.0
hecs = "0.10"

# Lazy initialization 라이브러리
# License: MIT or Apache-2.0
lazy_static = "1.5"

# 로그 인터페이스 라이브러리
# License: MIT or Apache-2.0
log = "0.4"

# 에러 타입을 쉽게 만들어주는 라이브러리
# License: MIT or Apache-2.0
thiserror = "1.0"

# 윈도우 생성 라이브러리
# License: Apache-2.0
winit = { version = "0.30", features = ["rwh_05"] }

# 크로스 플랫폼 렌더링 라이브러리 
# License: MIT or Apache-2.0
wgpu = "22"



# 자체 프레임워크 라이브러리
mod-error = { path = "../mod-error" }
mod-parallelism = { path = "../mod-parallelism" }
mod-render = { path = "../mod-render" }
mod-scene = { path = "../mod-scene" }
mod-util = { path = "../mod-util" }



[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# 사용 플랫폼: Windows, macOS
# 동기화를 위한 스레드 blocking 라이브러리
# License: MIT or Apache-2.0
pollster = "0.3"



[features]
default = ["command-line-args"]

# 명령줄 인수를 허용합니다.
command-line-args = []
