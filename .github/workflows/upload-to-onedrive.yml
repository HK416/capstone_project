name: Upload to OneDrive

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. GitHub Runner (서버)에 rclone 설치
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      # 3. rclone 설정 파일을 GitHub Secrets에서 가져와서 Runner에 저장
      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf

      # 4. OneDrive로 업로드
      - name: Upload to OneDrive
        run: |
          rclone copy . onedrive:GitHub/${{ github.event.repository.name }} -v
